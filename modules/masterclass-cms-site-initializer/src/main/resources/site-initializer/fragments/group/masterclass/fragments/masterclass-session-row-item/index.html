<div class="masterclass-session-row-card">
  <label class="masterclass-session-label">
    <!-- Radio Selector -->
    <div class="masterclass-session-radio-container">
      <input type="radio" name="selectedSession" class="masterclass-session-radio" />
      <span class="masterclass-session-checkmark"></span>
    </div>

    <!-- Sibling Senders details -->
    <div class="masterclass-session-details">
      <!-- Hidden Session ID (Editable & Mappable to Session ID field) -->
      <span class="masterclass-session-id d-none" data-lfr-editable-id="session-id" data-lfr-editable-type="text">0</span>

      <!-- Session Title (Editable & Mappable) -->
      <h5 class="masterclass-session-title" data-lfr-editable-id="session-title" data-lfr-editable-type="text">
        Session Title (Click to Edit or Map to Field)
      </h5>

      <div class="masterclass-session-dates">
        <span class="masterclass-session-date-label">Start:</span>
        <!-- Start Date (Editable & Mappable) -->
        <span class="masterclass-session-start-date" data-lfr-editable-id="session-start-date" data-lfr-editable-type="text">
          Jan 10, 2026
        </span>

        <span class="masterclass-session-date-separator">|</span>

        <span class="masterclass-session-date-label">End:</span>
        <!-- End Date (Editable & Mappable) -->
        <span class="masterclass-session-end-date" data-lfr-editable-id="session-end-date" data-lfr-editable-type="text">
          Feb 15, 2026
        </span>
      </div>
    </div>
  </label>
</div>
