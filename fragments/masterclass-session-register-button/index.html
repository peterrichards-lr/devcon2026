<div class="masterclass-session-register-wrapper">
  <!-- Hidden Course ID (Editable & Mappable to the Course ID on the DPT level) -->
  <span id="currentCourseId" class="d-none" data-lfr-editable-id="course-id" data-lfr-editable-type="text">0</span>

  <!-- Trigger Button to Open Modal -->
  <button type="button" class="btn btn-nm btn-primary masterclass-register-trigger-btn masterclass-btn masterclass-button text-break" data-toggle="modal" data-target="#sessionRegisterModal">
    <span>Register to a Session</span>
    <svg class="link-arrow" fill="none" height="9" viewBox="0 0 37 9" width="37" xmlns="http://www.w3.org/2000/svg">
      <path clip-rule="evenodd" d="M32.5607 0.146447L36.3536 3.93932C36.5488 4.13458 36.5488 4.45117 36.3536 4.64643L32.3536 8.64636C32.1583 8.84162 31.8417 8.84162 31.6465 8.64636C31.4512 8.4511 31.4512 8.13452 31.6465 7.93926L34.7929 4.79288H0.5V3.79288H34.7929L31.8536 0.853553C31.6583 0.658291 31.6583 0.341709 31.8536 0.146447C32.0488 -0.0488155 32.3654 -0.0488155 32.5607 0.146447Z" fill="var(--white)" fill-rule="evenodd" />
    </svg>
  </button>

  <!-- Popup Modal -->
  <div class="modal fade" id="sessionRegisterModal" tabindex="-1" role="dialog" aria-labelledby="sessionRegisterModalLabel" aria-hidden="true" style="display: none">
    <div class="modal-dialog modal-dialog-centered modal-lg" role="document">
      <div class="modal-content masterclass-modal-content">
        <div class="modal-header masterclass-modal-header">
          <h4 class="modal-title masterclass-modal-title" id="sessionRegisterModalLabel">Select an Available Session</h4>
          <button type="button" class="close masterclass-modal-close" data-dismiss="modal" aria-label="Close">
            <span aria-hidden="true">&times;</span>
          </button>
        </div>
        <div class="modal-body masterclass-modal-body">
          <p class="masterclass-modal-intro">Choose one of the scheduled course sessions below to complete your enrollment.</p>
          
          <!-- Dropzone container where Liferay Collection Display will be dragged inside -->
          <div class="masterclass-modal-dropzone-container">
            <lfr-drop-zone></lfr-drop-zone>
          </div>
          
          <div class="masterclass-modal-actions">
            <button type="button" class="btn masterclass-btn-secondary" data-dismiss="modal">Cancel</button>
            <button type="button" class="btn masterclass-btn-primary masterclass-confirm-register-btn" id="teConfirmRegisterBtn">Confirm Registration</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
